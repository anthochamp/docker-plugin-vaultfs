name: Publish edge

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Validate only — skip publishing to Docker Hub (dry run)"
        required: false
        type: boolean
        default: false

jobs:
  validate:
    uses: anthochamp/dev-toolbox/.github/workflows/go-validate.yml@main

  publish:
    needs: validate
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DHUB_USERNAME }}
          password: ${{ secrets.DHUB_PASSWORD }}

      - name: Publish edge plugin
        run: ./scripts/docker-plugin/release-all.sh edge
